name: Release

# Publishes reef-client to PyPI when a v* tag is pushed, via PyPI trusted
# publishing (configure the publisher once on pypi.org: this repo, this
# workflow file).

on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Build
        run: uv build
      - name: Smoke the wheel
        run: |
          uv venv smoke --python 3.12
          uv pip install --python smoke/bin/python dist/*.whl
          smoke/bin/python -c "from reef_client import ReefClient; print('ok')"
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
